<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vermilion Imperium - Enlistment</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1a1a1a;
            border: 2px solid #b30000;
            border-radius: 8px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 15px rgba(179, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            color: #b30000;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        p {
            color: #d4af37;
            font-size: 0.9em;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #0d0d0d;
            border: 1px solid #d4af37;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #b30000;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #b30000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VERMILION IMPERIUM</h1>
        <p>JOIN THE DISCORD</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Discord Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. user#0000" required>
            </div>
            
            <div class="form-group">
                <label for="age">Are you at least 13 years old?</label>
                <select id="age" name="age" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <button type="submit">SUBMIT ENLISTMENT</button>
        </form>
    </div>

</body>
</html>
